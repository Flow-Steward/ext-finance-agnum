manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.agnum
kind: tool_provider
version: 0.1.1
release_stage: active
billing_mode: free
display_name: Agnum
description: 'Connect workflows to Agnum, the Lithuanian business management and accounting
  system, through its Agnum DB API. Everyday steps find clients and products, find
  or create a client, create a sales document or a purchase receipt only when its
  number is new, and save a sales document as PDF.


  Every one of the 39 documented operations has its own step: clients and their documents,
  products, prices and stock, sales documents and tracking, purchase receipts, customer
  returns, production and processing norms, and employees. Amounts are sent as exact
  decimals. Steps that replace, change or delete norms take an explicit ID. Each connection
  is one Agnum API address and its API key.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-agnum/issues
  website_url: https://github.com/Flow-Steward/ext-finance-agnum
listing:
  category: finance
  tags:
  - agnum
  - accounting
  - lithuania
  - erp
  - invoices
  - inventory
  summary: Read and write Agnum clients, products, prices, stock, sales documents,
    purchase receipts, returns and production norms.
  categories:
  - finance
  - inventory
  - sales
  setup_summary: Get the Agnum DB API address and an API key with the rights the steps
    need from your Agnum administrator or provider, add them to a project connection
    and run the connection test.
