components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps reach the Agnum DB API at the address set in the connection, with its API key. Each step makes one documented call, except the everyday steps, which make two. Every documented operation has a step: 45 steps in all.

    - **Rights.** Each step says which right its key needs (for example READ_KL to read clients, SAVE_VSK to create sales documents; READ_ALL, SAVE_ALL, EDIT_ALL and DEL_ALL cover all). A key without it is refused and nothing changes.
    - **Amounts are exact decimals.** They are sent as written, never rounded through binary floating point.
    - **Writes are sent once.** Flow Steward remembers every change it made, so a retried step does not send it twice, and test runs never send. When the outcome is unclear, the step is not retried: check Agnum first.
    - **Searches** compare every filter the same way (Compare: equals by default). Nothing found is an empty list.
    - **6 steps delete data**: replacing or changing a production or processing norm and deleting a norm. They take an explicit norm ID and come last in their section.

    The steps by area:

    - **Agnum API** (20 steps): Everyday, Clients, Products, prices and stock.
    - **Documents** (11 steps): Sales documents, Purchase receipts, Customer returns.
    - **Production and staff** (14 steps): Production norms, Processing norms, Employees.
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test connection

    Checks that the address answers as the Agnum API and that the key is accepted, with one client search that finds nothing. Needs the key right READ_KL or READ_ALL.

    Action id `test_connection` · reads only · Agnum: `GET /api/clients/search`

    **Inputs**

    - none

    **Results**

    - `connected` (yes/no): True when Agnum accepted the key.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find client

    Finds the one client whose code, company code and e-mail equal the ones given (give at least one). Every client Agnum returns is checked again here; more than one match is a conflict. Needs READ_KL or READ_ALL.

    Action id `find_client` · reads only · Agnum: `GET /api/clients/search`

    **Inputs**

    - `code` (text): The client's code in Agnum.
    - `company_code` (text): The company's registration code.
    - `email` (text): The client's e-mail address.

    **Results**

    - `found` (yes/no): True when one client matches.
    - `client_id` (whole number): The client's ID.
    - `client` (record): The client as Agnum returns it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find or create client

    Finds the client by the code, company_code and e-mail given (at least one) and creates it with the fields given when none matches. When one of those values alone finds a client with different other values, the step stops with a conflict instead of creating a near-duplicate; more than one match is a conflict too. Needs READ_KL and SAVE_KL (or READ_ALL and SAVE_ALL).

    Action id `find_or_create_client` · changes data · Agnum: `GET /api/clients/search`, `POST /api/clients`

    **Inputs**

    - `code` (text): Client code
    - `name` (text): Client name
    - `company_code` (text): Company code
    - `vat_code` (text): VAT code
    - `price_group` (whole number): Client price group, default 4
    - `email` (text): Client email address
    - `registeredAddress` (text): Registered office address
    - `officeAddress` (text): Office address
    - `client_role` (list): Agnum client type
    - `f1` (text): additional customer text field
    - `f2` (text): additional customer text field
    - `f3` (text): additional customer text field
    - `f4` (text): additional customer text field
    - `f5` (text): additional customer text field
    - `f6` (text): additional customer text field
    - `f7` (text): additional customer text field
    - `f8` (text): additional customer text field
    - `f9` (text): additional customer text field
    - `f10` (text): additional customer text field
    - `f11` (text): additional customer text field
    - `f12` (text): additional customer text field
    - `f13` (text): additional customer text field
    - `f14` (text): additional customer text field
    - `f15` (text): additional customer text field
    - `fs1` (decimal): additional customer numeric field
    - `fs2` (decimal): additional customer numeric field
    - `fs3` (decimal): additional customer numeric field
    - `fs4` (decimal): additional customer numeric field
    - `fs5` (decimal): additional customer numeric field
    - `modify_date` (date and time)
    - `create_date` (date): The client's creation date in Agnum, YYYY-MM-DD. Default: today (UTC).
    - `adr` (record): Client address
    - `payment_term_receipt` (whole number): Number of days allowed for payment of the receipt
    - `payment_term_order` (whole number): Number of days allowed for payment of the order
    - `pozym_numbers` (list)

    **Results**

    - `client_id` (whole number): The client's ID.
    - `created` (yes/no): True when the client was created.
    - `client` (record): The client as Agnum returns it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find product

    Finds the one product whose code and barcode equal the ones given (give at least one), optionally in one warehouse. Every product Agnum returns is checked again here; more than one match is a conflict. Needs READ_PRK or READ_ALL.

    Action id `find_product` · reads only · Agnum: `GET /api/products/search`

    **Inputs**

    - `code` (text): The product's code in Agnum.
    - `barcode` (text): One of the product's barcodes.
    - `wh` (text): A warehouse code, to look in that warehouse only.

    **Results**

    - `found` (yes/no): True when one product matches.
    - `product_id` (whole number): The product's ID.
    - `product` (record): The product as Agnum returns it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create sales document if new

    Creates a sales document — an invoice, an order or an offer (doc_type) — once per document number (doc_no). Before writing, the step looks the number up and stops with a conflict, writing nothing, when Agnum already has a document with it. When the lookup cannot be trusted (Agnum returns documents with other numbers), it also stops without writing. Needs READ_VSK and SAVE_VSK (or READ_ALL and SAVE_ALL).

    Action id `create_sales_document_if_new` · changes data · Agnum: `GET /api/orders/search`, `POST /api/orders`

    **Inputs**

    - `date` (date, required)
    - `doc_no` (text, required)
    - `reg_no` (text)
    - `sum` (decimal, required)
    - `vat_sum` (decimal, required)
    - `total` (decimal, required)
    - `memo` (text)
    - `delivery_code` (text)
    - `tracking` (text)
    - `pozym_numbers` (list)
    - `delivery` (record)
    - `client` (record, required)
    - `sf_type` (text): SF, DS, KS, VS, VD, VK
    - `location` (text)
    - `wh` (text)
    - `products` (list)
    - `price_group` (whole number): Price type: 3 – Wholesale, 4 – Retail, 5 – Additional price 1, 6 – Additional price 2, 7 – Additional price 3
    - `doc_type` (whole number): save doc to (1 - Atd, 2 - Uzs, 3 - Pas, default = 1)
    - `paid_type` (whole number): paid type (0 - Grynais, 1 - Skolon, 3 - Kasos čekis, 2 - K10, default = 1)
    - `cash_receipt_no` (text): Cash receipt number
    - `cash_register_no` (text): Cash register number
    - `cash_receipt_datetime` (date and time)
    - `cash_receipt_round` (decimal)
    - `paid_term` (whole number)
    - `f1` (text): additional order text field
    - `f2` (text): additional order text field
    - `f3` (text): additional order text field
    - `f4` (text): additional order text field
    - `f5` (text): additional order text field

    **Results**

    - `id` (whole number): The new document's ID in Agnum.
    - `data` (record): What Agnum returned: the ID, the document number and the registration number as Agnum gives them.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create purchase receipt if new

    Creates a purchase receipt once per supplier and document number (doc_no). Before writing, the step looks the number up and stops with a conflict, writing nothing, when Agnum already has a document with it from the same supplier, or one whose supplier cannot be told apart. When the lookup cannot be trusted (Agnum returns documents with other numbers), it also stops without writing. Needs READ_VKS and SAVE_VKS (or READ_ALL and SAVE_ALL).

    Action id `create_purchase_receipt_if_new` · changes data · Agnum: `GET /api/receipts/search`, `POST /api/receipts`

    **Inputs**

    - `date` (date, required)
    - `receipt_date` (date, required)
    - `tracking` (text)
    - `doc_no` (text, required)
    - `reg_no` (text)
    - `total` (decimal)
    - `sum` (decimal)
    - `vat` (decimal, required)
    - `paid_amount` (decimal)
    - `transp_amount` (decimal)
    - `wh` (text)
    - `location` (text)
    - `payment_term_days` (whole number)
    - `memo` (text)
    - `client` (record, required)
    - `products` (list)
    - `f1` (text): additional receipt text field
    - `f2` (text): additional receipt text field
    - `f3` (text): additional receipt text field
    - `f4` (text): additional receipt text field
    - `f5` (text): additional receipt text field
    - `include_in_vat_register` (yes/no): Indicates whether the document should be included in the incoming VAT invoice register.
    - `include_goods` (yes/no): Include goods amount in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_services` (yes/no): Include services amount in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_consignment` (yes/no): Include consignment amount in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_transp` (yes/no): Include transport costs in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_vat` (yes/no): Include VAT amount in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_custom` (yes/no): Include customs duty in the receipt document total.
    - `include_excise` (yes/no): Include excise duty in the receipt document total.
    - `include_deposit` (yes/no): Include deposit packaging amount in the receipt document total. Defaults to true if the amount is greater than 0.
    - `include_other` (yes/no): Include other costs in the receipt document total.
    - `pozym_numbers` (list)

    **Results**

    - `id` (whole number): The new document's ID in Agnum.
    - `data` (record): What Agnum returned: the ID, the document number and the registration number as Agnum gives them.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Save sales document PDF

    Saves the PDF of a sales document, found by its number, as a workflow file. Needs the key right READ_VSK_PDF or READ_ALL.

    Action id `orders_pdf_get` · reads only · Agnum: `GET /api/orders/pdf/{docNo}`

    **Inputs**

    - `docNo` (text, required): document number

    **Results**

    - `file` (file): The PDF, as a workflow file.
    - `file_name` (text): Its file name from Agnum.
    - `doc_no` (text): The document number.
    - `document_id` (whole number): The document's ID in Agnum.
    - `size_bytes` (whole number): The PDF's size.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_clients
  type: markdown
  title: Clients
  body: |
    ### Get client

    Reads a client by ID. Needs the key right READ_KL or READ_ALL.

    Action id `clients_get` · reads only · Agnum: `GET /api/clients/{id}`

    **Inputs**

    - `id` (whole number, required)

    **Results**

    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search client payment documents

    Finds clients' sales documents with what was charged and paid, by client code or company code, document, payment state, dates or warehouse. Agnum documents its paging here only as one limit/offset parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an empty list. Needs the key right READ_KL_DOK or READ_ALL.

    Action id `clients_doc_search` · reads only · Agnum: `GET /api/clients/doc/search`

    **Inputs**

    - `code` (text): code
    - `client_code` (text): client_code
    - `id` (text): Order id
    - `order_no` (text): Order number
    - `dok_reg_nr` (text): Order registration number
    - `paid` (one of y, n): y - paid, n - not paid, empty - all
    - `modify` (date and time): Order modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `min_date` (date): Order minimum date (format: yyyy-MM-dd) YYYY-MM-DD.
    - `max_date` (date): Order maximum date (format: yyyy-MM-dd) YYYY-MM-DD.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of order_no, id, dok_reg_nr, modify, date): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search clients

    Finds clients by ID, code, name, company code, e-mail, debt, change time or sales agent. Nothing found is an empty list. Needs the key right READ_KL or READ_ALL.

    Action id `clients_search` · reads only · Agnum: `GET /api/clients/search`

    **Inputs**

    - `id` (text): Client id
    - `code` (text): Client agnum code
    - `name` (text): Client name
    - `client_code` (text): Client company code
    - `email` (text): client email
    - `debt` (decimal): Client debt amount
    - `modify` (date and time): client modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `agent_id` (text): Client agent id
    - `agent_code` (text): Client agent code
    - `agent_name` (text): Client agent name
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of code, id, name, email, modify, debt): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search one client's payment documents

    Finds one client's sales documents (client_id) with what was charged and paid, by document, payment state, dates or warehouse. Agnum documents its paging here only as one limit/offset parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an empty list. Needs the key right READ_KL_DOK or READ_ALL.

    Action id `clients_id_doc_search` · reads only · Agnum: `GET /api/clients/{id}/doc/search`

    **Inputs**

    - `client_id` (whole number, required)
    - `code` (text): code
    - `client_code` (text): client_code
    - `id` (text): Order id
    - `order_no` (text): Order number
    - `dok_reg_nr` (text): Order registration number
    - `paid` (one of y, n): y - paid, n - not paid, empty - all
    - `modify` (date and time): Order modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `min_date` (date): Order minimum date (format: yyyy-MM-dd) YYYY-MM-DD.
    - `max_date` (date): Order maximum date (format: yyyy-MM-dd) YYYY-MM-DD.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of order_no, id, dok_reg_nr, modify, date): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create client

    Creates a client with its code, name, company and VAT codes, roles (client_role: BUYER, SUPPLIER, CARRIER, INDIVIDUAL, B1–B10), address and payment terms. Running the step again creates the record again. Needs the key right SAVE_KL or SAVE_ALL.

    Action id `clients_create` · changes data · Agnum: `POST /api/clients`

    **Inputs**

    - `code` (text): Client code
    - `name` (text): Client name
    - `company_code` (text): Company code
    - `vat_code` (text): VAT code
    - `price_group` (whole number): Client price group, default 4
    - `email` (text): Client email address
    - `registeredAddress` (text): Registered office address
    - `officeAddress` (text): Office address
    - `client_role` (list): Agnum client type
    - `f1` (text): additional customer text field
    - `f2` (text): additional customer text field
    - `f3` (text): additional customer text field
    - `f4` (text): additional customer text field
    - `f5` (text): additional customer text field
    - `f6` (text): additional customer text field
    - `f7` (text): additional customer text field
    - `f8` (text): additional customer text field
    - `f9` (text): additional customer text field
    - `f10` (text): additional customer text field
    - `f11` (text): additional customer text field
    - `f12` (text): additional customer text field
    - `f13` (text): additional customer text field
    - `f14` (text): additional customer text field
    - `f15` (text): additional customer text field
    - `fs1` (decimal): additional customer numeric field
    - `fs2` (decimal): additional customer numeric field
    - `fs3` (decimal): additional customer numeric field
    - `fs4` (decimal): additional customer numeric field
    - `fs5` (decimal): additional customer numeric field
    - `modify_date` (date and time)
    - `create_date` (date, required)
    - `adr` (record): Client address
    - `payment_term_receipt` (whole number): Number of days allowed for payment of the receipt
    - `payment_term_order` (whole number): Number of days allowed for payment of the order
    - `pozym_numbers` (list)

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Update client

    Changes a client named by its ID or code: the fields given are written. Needs the key right EDIT_KL or EDIT_ALL.

    Action id `clients_update` · changes data · Agnum: `PUT /api/clients`

    **Inputs**

