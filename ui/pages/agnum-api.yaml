- component_id: steps_products
  type: markdown
  title: Products, prices and stock
  body: |
    ### Get product

    Reads a product by its ID. Needs the key right READ_PRK or READ_ALL.

    Action id `products_get` · reads only · Agnum: `GET /api/products/{id}`

    **Inputs**

    - `id` (whole number, required): agnum product ID

    **Results**

    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get stock quantities

    Reads stock quantities of products, by product or warehouse. Agnum documents its paging here only as one limit/offset parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an empty list. Needs the key right READ_PRK_QTY or READ_ALL.

    Action id `products_qty_search` · reads only · Agnum: `GET /api/products/qty/search`

    **Inputs**

    - `id` (text): product id
    - `code` (text): product code
    - `name` (text): product name
    - `modify` (date and time): product modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `qty` (decimal): product quantity
    - `barcode` (text): product barcode
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of code, id, qty, barcode): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `text` (text): Agnum's answer as text, when it is not JSON (its format is not documented).
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search product prices

    Reads product prices and costs, by product or warehouse. Agnum documents its paging here only as one limit/offset parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an empty list. Needs the key right READ_PRK_PRICE or READ_ALL.

    Action id `products_price_search` · reads only · Agnum: `GET /api/products/price/search`

    **Inputs**

    - `id` (text): product id
    - `code` (text): product code
    - `name` (text): product name
    - `barcode` (text): product barcode
    - `wh` (text): warehouse code
    - `modify` (date and time): product modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of id, code, barcode): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search products

    Finds products by ID, code, name, barcode, quantity, change time or warehouse. Agnum documents its paging here only as one limit/offset parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an empty list. Needs the key right READ_PRK or READ_ALL.

    Action id `products_search` · reads only · Agnum: `GET /api/products/search`

    **Inputs**

    - `id` (text): product id
    - `code` (text): product code
    - `quant` (decimal): product quantity
    - `name` (text): product name
    - `modify` (date and time): product modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `barcode` (text): product barcode
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of code, id, name, quant, barcode): The column to sort by.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
