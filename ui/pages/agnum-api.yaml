    ### Update product prices

    Sets prices (kn0 purchase, kn1 wholesale, kn2 retail, kn3–kn5 additional, knmin minimum, knb base) of products found by ID or code, in the default warehouse or, with wh_all, in all warehouses. Agnum updates only the price levels enabled in its API settings and ignores the others without saying so. Needs the key right EDIT_PRK_PRICE or EDIT_ALL.

    Action id `products_price_update` · changes data · Agnum: `PUT /api/products/price`

    **Inputs**

    - `prices` (list, required): One row per product: the product (product_id or product_code) and the prices to set. Each needs product_id or product_code.

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.
