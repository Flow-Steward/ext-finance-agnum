- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The Agnum DB API 1.47.2 documents 39 operations; **39 of them have their own step** in this version.

    - **22 reads**: records by ID or number, searches and the sales document PDF.
    - **11 writes** that create or change clients, products, prices, documents, norms and working time.
    - **4 norm replacements and changes** that delete stored rows.
    - **2 deletions** of norms, each by explicit ID.

    The everyday steps on top combine two operations: test the connection, find a client or a product, find or create a client, and create a sales document or a purchase receipt only when its number is new.
