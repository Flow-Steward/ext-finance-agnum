- component_id: steps_orders
  type: markdown
  title: Sales documents
  body: |
    ### Get sales document

    Reads a sales document by its number. Needs the key right READ_VSK or READ_ALL.

    Action id `orders_get` · reads only · Agnum: `GET /api/orders/{docNo}`

    **Inputs**

    - `docNo` (text, required)

    **Results**

    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get sales document tracking

    Reads the tracking of a sales document by its number. Needs the key right READ_VSK_TRACKING or READ_ALL.

    Action id `orders_tracking_get` · reads only · Agnum: `GET /api/orders/tracking/{docNo}`

    **Inputs**

    - `docNo` (text, required): document number

    **Results**

    - `data` (record): What Agnum returned.
    - `text` (text): Agnum's answer as text, when it is not JSON (its format is not documented).
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search sales document tracking

    Finds sales document tracking by ID, document number or tracking number. Give at least one filter. Nothing found is an empty list. Needs the key right READ_VSK_TRACKING or READ_ALL.

    Action id `orders_tracking_search` · reads only · Agnum: `GET /api/orders/tracking/search`

    **Inputs**

    - `id` (whole number)
    - `doc_no` (text)
    - `track_no` (text)

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search sales documents

    Finds sales documents (invoices, orders, offers) by ID, number, registration number, date, change time or warehouse. Give at least one filter. Nothing found is an empty list. Needs the key right READ_VSK or READ_ALL.

    Action id `orders_search` · reads only · Agnum: `GET /api/orders/search`

    **Inputs**

    - `id` (whole number): Document ID (numeric). Compared using filter_type.
    - `order_no` (text): Document number. Case-insensitive. Compared using filter_type.
    - `reg_no` (text): Document registration number. Case-insensitive. Compared using filter_type.
    - `date` (date): Document date. Format: yyyy-MM-dd YYYY-MM-DD.
    - `modify` (date and time): Last modification timestamp. Format: yyyy-MM-dd HH:mm:ss. YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of order_no, reg_no, id, date): The column to sort by.
    - `limit` (whole number): At most this many records (1–250; Agnum's default 250).
    - `offset` (whole number): Skip this many records first, to read the next page.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create sales document

    Creates a sales document — an invoice, an order or an offer (doc_type) — for a client with its product lines and totals. Running the step again creates the record again. Create sales document if new stops at a number Agnum already has. Needs the key right SAVE_VSK or SAVE_ALL.

    Action id `orders_create` · changes data · Agnum: `POST /api/orders`

    **Inputs**

    - `date` (date, required)
    - `doc_no` (text, required)
    - `reg_no` (text)
    - `sum` (decimal, required)
    - `vat_sum` (decimal, required)
    - `total` (decimal, required)
    - `memo` (text)
    - `delivery_code` (text)
    - `tracking` (text)
    - `pozym_numbers` (list)
    - `delivery` (record)
    - `client` (record, required)
    - `sf_type` (text): SF, DS, KS, VS, VD, VK
    - `location` (text)
    - `wh` (text)
    - `products` (list)
    - `price_group` (whole number): Price type: 3 – Wholesale, 4 – Retail, 5 – Additional price 1, 6 – Additional price 2, 7 – Additional price 3
    - `doc_type` (whole number): save doc to (1 - Atd, 2 - Uzs, 3 - Pas, default = 1)
    - `paid_type` (whole number): paid type (0 - Grynais, 1 - Skolon, 3 - Kasos čekis, 2 - K10, default = 1)
    - `cash_receipt_no` (text): Cash receipt number
    - `cash_register_no` (text): Cash register number
    - `cash_receipt_datetime` (date and time)
    - `cash_receipt_round` (decimal)
    - `paid_term` (whole number)
    - `f1` (text): additional order text field
    - `f2` (text): additional order text field
    - `f3` (text): additional order text field
    - `f4` (text): additional order text field
    - `f5` (text): additional order text field

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.
