- component_id: steps_employee
  type: markdown
  title: Employees
  body: |
    ### Get employee

    Reads an employee by ID. Needs the key right READ_DRB or READ_ALL.

    Action id `employee_get` · reads only · Agnum: `GET /api/employee/{id}`

    **Inputs**

    - `id` (whole number, required): agnum employee ID

    **Results**

    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Record employee working time

    Records an employee's (driver's) working time for a day, as the documentation's example shows: date, driverID, workTimeDay, workTimeNight. Running the step again creates the record again. Needs the key right SAVE_TBL or SAVE_ALL.

    Action id `employee_timesheet_create` · changes data · Agnum: `POST /api/employee/timesheet`

    **Inputs**

    - `date` (date, required): As in the documentation's example (2024-12-31). YYYY-MM-DD.
    - `driverID` (text, required): As in the documentation's example (11).
    - `workTimeDay` (whole number, required): As in the documentation's example (19800).
    - `workTimeNight` (whole number, required): As in the documentation's example (12000).

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `text` (text): Agnum's answer as text, when it is not JSON (its format is not documented).
    - `warnings` (list): What the step could not do fully or what to check.
