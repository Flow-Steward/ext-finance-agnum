  type: markdown
  title: Production norms
  body: |
    ### Get production norm

    Reads a production norm by its ID. Needs the key right READ_PROD_NORMS or READ_ALL.

    Action id `production_norms_get` · reads only · Agnum: `GET /api/production/norms/{id}`

    **Inputs**

    - `id` (whole number, required): agnum production norm ID
    - `wh` (text): warehouse code

    **Results**

    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Search production norms

    Finds production norms by ID, code, product, change time or warehouse. Give at least one filter. Nothing found is an empty list. Needs the key right READ_PROD_NORMS or READ_ALL.

    Action id `production_norms_search` · reads only · Agnum: `GET /api/production/norms/search`

    **Inputs**

    - `id` (whole number): Norm ID (numeric). Compared using filter_type.
    - `code` (text): Norm code. Case-insensitive. Compared using filter_type.
    - `product_code` (text): Product code. Case-insensitive. Compared using filter_type.
    - `product_id` (whole number): Product ID (numeric). Compared using filter_type.
    - `modify` (date and time): Last modification timestamp. Format: yyyy-MM-dd HH:mm:ss. YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
    - `wh` (text): Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
    - `filter_type` (one of eq, ne, co, gt, lt, le, …): How every filter compares: eq equals (Agnum's default), ne not equal, co contains, gt, ge, lt, le greater/less (or equal).
    - `order` (one of id, code, product_code, modify_date): The column to sort by.
    - `limit` (whole number): At most this many records (1–250; Agnum's default 250).
    - `offset` (whole number): Skip this many records first, to read the next page.

    **Results**

    - `items` (list): The records found (an empty list when Agnum finds nothing).
    - `count` (whole number): How many records were returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create production norm

    Creates a production norm: the product made, its quantity, the raw products used and the labour costs. Running the step again creates the record again. Needs the key right SAVE_PROD_NORMS or SAVE_ALL.

    Action id `production_norms_create` · changes data · Agnum: `POST /api/production/norms`

    **Inputs**

    - `product_id` (whole number)
    - `norm_code` (text)
    - `product_qty` (decimal)
    - `memo` (text)
    - `cost` (decimal)
    - `raw_products` (list)
    - `costs` (list)
    - `modify_date` (date and time)

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    **Replacing and changing norms.** These delete stored rows as part of what they do; the step cannot undo it.

    ### Change production norm and its rows

    Changes the production norm whose ID is given: header fields given are written; raw product and cost rows are added, changed or deleted. Rows given with rec_id and "delete": true are deleted, rows with rec_id are changed and rows without it are added; the step cannot undo it. Needs the key right EDIT_PROD_NORMS or EDIT_ALL.

    Action id `production_norms_patch` · changes data · Agnum: `PATCH /api/production/norms`

    **Inputs**

    - `id` (whole number, required): Norm ID. Ignored in POST (auto-generated), required in PUT/PATCH.
    - `product_id` (whole number)
    - `norm_code` (text)
    - `product_qty` (decimal)
    - `memo` (text)
    - `cost` (decimal)
    - `raw_products` (list)
    - `costs` (list)
    - `modify_date` (date and time)

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Replace production norm

    Replaces the production norm whose ID is given with the one given, rows included. Agnum deletes the stored norm and writes the one given (its documented "delete old, write new"): rows left out are gone, and the step cannot undo it. Needs the key right EDIT_PROD_NORMS or EDIT_ALL.

    Action id `production_norms_update` · changes data · Agnum: `PUT /api/production/norms`

    **Inputs**

    - `id` (whole number, required): Norm ID. Ignored in POST (auto-generated), required in PUT/PATCH.
    - `product_id` (whole number)
    - `norm_code` (text)
    - `product_qty` (decimal)
    - `memo` (text)
    - `cost` (decimal)
    - `raw_products` (list)
    - `costs` (list)
    - `modify_date` (date and time)

    **Results**

    - `id` (whole number): The record's ID, when Agnum returns one.
    - `data` (record): What Agnum returned.
    - `warnings` (list): What the step could not do fully or what to check.

    **Deletions.** Only the norm whose ID is given; nothing deleted can be restored by a step.

    ### Delete production norm

    Deletes the production norm whose ID is given. Only the norm whose ID is given; Agnum refuses a norm in use (nothing is deleted then). Deletion cannot be undone. Needs the key right DEL_PROD_NORMS or DEL_ALL.

    Action id `production_norms_delete` · changes data · Agnum: `DELETE /api/production/norms/{id}`

    **Inputs**

    - `id` (whole number, required): production norm ID

    **Results**

    - `deleted_id` (whole number): The ID sent for deletion.
    - `data` (record): What Agnum returned (true when it deleted the norm).
    - `warnings` (list): What the step could not do fully or what to check.
