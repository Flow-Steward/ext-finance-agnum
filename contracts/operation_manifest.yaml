- operation_id: orders_search
  display_name: Search sales documents
  description: Finds sales documents (invoices, orders, offers) by ID, number, registration number, date,
    change time or warehouse. Give at least one filter. Nothing found is an empty list. Needs the key
    right READ_VSK or READ_ALL.
  operation_kind: source
  category: finance
  connection_type_ids:
  - agnum
  workflow_visible: true
  inputs:
  - *id001
  - name: id
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000000000000
      description: Document ID (numeric). Compared using filter_type.
      title: id
  - name: order_no
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Document number. Case-insensitive. Compared using filter_type.
      title: order_no
  - name: reg_no
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Document registration number. Case-insensitive. Compared using filter_type.
      title: reg_no
  - name: date
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: 'Document date. Format: yyyy-MM-dd YYYY-MM-DD.'
      title: date
  - name: modify
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}:\d{2})?$
      description: 'Last modification timestamp. Format: yyyy-MM-dd HH:mm:ss. YYYY-MM-DD or YYYY-MM-DD
        HH:MM:SS.'
      title: modify
  - name: wh
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
      title: wh
  - name: filter_type
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - eq
      - ne
      - co
      - gt
      - lt
      - le
      - ge
      title: Compare
      description: 'How every filter compares: eq equals (Agnum''s default), ne not equal, co contains,
        gt, ge, lt, le greater/less (or equal).'
  - name: order
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - order_no
      - reg_no
      - id
      - date
      title: Sort by
      description: The column to sort by.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 250
      title: Limit
      description: At most this many records (1–250; Agnum's default 250).
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 1000000000
      title: Offset
      description: Skip this many records first, to read the next page.
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
        description: One record.
        properties:
          date: {}
          doc_no: {}
          reg_no: {}
