- operation_id: products_price_update
  display_name: Update product prices
  description: Sets prices (kn0 purchase, kn1 wholesale, kn2 retail, kn3–kn5 additional, knmin minimum,
    knb base) of products found by ID or code, in the default warehouse or, with wh_all, in all warehouses.
    Agnum updates only the price levels enabled in its API settings and ignores the others without saying
    so. Needs the key right EDIT_PRK_PRICE or EDIT_ALL.
  operation_kind: action
  category: finance
  connection_type_ids:
  - agnum
  workflow_visible: true
  effect_kind: agnum_products_price_update
  inputs:
  - *id001
  - name: prices
    value_type: array
    required: true
    schema:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        properties:
          product_id:
            type: integer
            minimum: 1
            maximum: 1000000000000000
          product_code:
            type: string
            maxLength: 25
            description: 'agnum laukas: kodas'
          wh_all:
            type: boolean
            description: Update prices in all warehouses. Default value is false. When true, the specified
              prices are applied to all warehouses.
          kn0:
            type:
            - number
            - string
            description: 'agnum laukas: pirkimo kaina'
          kn1:
            type:
            - number
            - string
            description: 'agnum laukas: didmeninė kaina'
          kn2:
            type:
            - number
            - string
            description: 'agnum laukas: mažmeninė kaina'
          kn3:
            type:
            - number
            - string
            description: 'agnum laukas: pirma papildoma kaina'
          kn4:
            type:
            - number
            - string
            description: 'agnum laukas: antra papildoma kaina'
          kn5:
            type:
            - number
            - string
            description: 'agnum laukas: trečia papildoma kaina'
          knmin:
            type:
            - number
            - string
            description: 'agnum laukas: minimali kaina'
          knb:
            type:
            - number
            - string
            description: 'agnum laukas: bazinė kaina'
      minItems: 1
      description: 'One row per product: the product (product_id or product_code) and the prices to set.
        Each needs product_id or product_code.'
      title: Prices
  outputs:
  - name: id
    value_type: text
    schema:
      type:
      - integer
      - string
      - 'null'
      description: The record's ID, when Agnum returns one.
  - name: data
    value_type: object
    schema:
      type:
      - object
      - array
      - boolean
      - string
      - number
      - 'null'
      additionalProperties: true
      description: What Agnum returned.
  - *id002
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.id
  - result.data
  - result.warnings
