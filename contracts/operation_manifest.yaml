  display_name: Search client payment documents
  description: Finds clients' sales documents with what was charged and paid, by client code or company
    code, document, payment state, dates or warehouse. Agnum documents its paging here only as one limit/offset
    parameter, so the step sends none and returns what Agnum returns in one answer. Nothing found is an
    empty list. Needs the key right READ_KL_DOK or READ_ALL.
  operation_kind: source
  category: finance
  connection_type_ids:
  - agnum
  workflow_visible: true
  inputs:
  - *id001
  - name: code
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: code
      title: code
  - name: client_code
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: client_code
      title: client_code
  - name: id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Order id
      title: id
  - name: order_no
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Order number
      title: order_no
  - name: dok_reg_nr
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Order registration number
      title: dok_reg_nr
  - name: paid
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 1
      enum:
      - y
      - n
      description: y - paid, n - not paid, empty - all
      title: paid
  - name: modify
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}:\d{2})?$
      description: 'Order modify date time (format: yyyy-MM-dd HH:mm:ss) YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.'
      title: modify
  - name: min_date
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: 'Order minimum date (format: yyyy-MM-dd) YYYY-MM-DD.'
      title: min_date
  - name: max_date
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: 'Order maximum date (format: yyyy-MM-dd) YYYY-MM-DD.'
      title: max_date
  - name: wh
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200
      minLength: 1
      description: Warehouse code. Multiple values can be comma-separated, e.g. `S001,S002`.
      title: wh
  - name: filter_type
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - eq
      - ne
      - co
      - gt
      - lt
      - le
      - ge
      title: Compare
      description: 'How every filter compares: eq equals (Agnum''s default), ne not equal, co contains,
        gt, ge, lt, le greater/less (or equal).'
  - name: order
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - order_no
      - id
      - dok_reg_nr
      - modify
      - date
      title: Sort by
      description: The column to sort by.
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
        description: One record.
        properties:
          id:
            description: Paid doc ID
          order_no:
            description: Order number
          dok_reg_nr:
            description: Order registration number
          charged:
            description: Charged amount
          paid:
            description: Paid amount
          date:
            description: Date of order Deprecated by Agnum.
          order_date:
            description: Date of order
          paid_date:
            description: Date of paid
          tracking:
            description: tracking
          client_id: {}
          client_code: {}
      description: The records found (an empty list when Agnum finds nothing).
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many records were returned.
  - *id002
