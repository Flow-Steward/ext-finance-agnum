  display_name: Record employee working time
  description: 'Records an employee''s (driver''s) working time for a day, as the documentation''s example
    shows: date, driverID, workTimeDay, workTimeNight. Running the step again creates the record again.
    Needs the key right SAVE_TBL or SAVE_ALL.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - agnum
  workflow_visible: true
  effect_kind: agnum_employee_timesheet_create
