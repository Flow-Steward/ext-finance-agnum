  - name: date
    value_type: text
    required: true
    schema:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: As in the documentation's example (2024-12-31). YYYY-MM-DD.
      title: date
  - name: driverID
    value_type: text
    required: true
    schema:
      type: string
      maxLength: 100
      minLength: 1
      description: As in the documentation's example (11).
      title: driverID
  - name: workTimeDay
    value_type: integer
    required: true
    schema:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: As in the documentation's example (19800).
      title: workTimeDay
  - name: workTimeNight
    value_type: integer
    required: true
    schema:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: As in the documentation's example (12000).
      title: workTimeNight
  outputs:
  - name: id
    value_type: text
    schema:
      type:
      - integer
      - string
      - 'null'
