connection_types:
  - connection_type_id: agnum
    display_name: Agnum
    description: One Agnum DB API (its address) and the API key the steps use.
    auth:
      type: static_secret
    config_schema:
      type: object
      additionalProperties: false
      required: [base_url]
      properties:
        label:
          type: string
          maxLength: 190
          title: Label
          description: Optional name for this connection, for example the company.
        base_url:
          type: string
          maxLength: 300
          pattern: "^https://[^/?#@ ]+(/[A-Za-z0-9._~-]+)*/?$"
          title: Agnum API address
          description: The API's root, as its Swagger page shows it without /swagger-ui/…, for example https://server.example.lt/agnumAPIv2. https only.
    secret_schema:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 512
          pattern: "^[\\x21-\\x7e]+$"
          title: API key
          description: The Agnum DB API key (sent as X-API-KEY), with the rights the steps need.
    capabilities:
      test_connection: true
